[package]
name = "rd-integrations"
description = "Services that talk to external tools and web services: git, build command, php -l / Plugin Check, WordPress.org API, GitHub releases, SVN repository setup"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rd-support = { path = "../rd-support" }
rd-model = { path = "../rd-model" }
rd-versioning = { path = "../rd-versioning" }
rd-inspection = { path = "../rd-inspection" }
rd-records = { path = "../rd-records" }
rd-svn = { path = "../rd-svn" }
thiserror.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["process", "time", "macros", "rt", "fs", "sync"] }
async-trait = "0.1"
# HTTPS with rustls (reqwest's default TLS, aws-lc-rs provider, OS certificate verifier); no OpenSSL.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "system-proxy"] }
url = "2"
percent-encoding = "2"
# git, php and wp on PATH, after the fixed install locations.
which = "8"
# Local time in the GitHub rate-limit message (Swift `Date.formatted(time: .shortened)`).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["process", "time", "macros", "rt", "rt-multi-thread", "fs", "sync", "net", "io-util"] }

[lints]
workspace = true
