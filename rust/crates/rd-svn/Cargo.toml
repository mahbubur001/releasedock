[package]
name = "rd-svn"
description = "Subversion client wrapper: process runner, svn --xml parsing, SVN service and command transcript"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rd-support = { path = "../rd-support" }
rd-model = { path = "../rd-model" }
thiserror.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["process", "time", "macros", "rt", "io-util", "sync"] }
tokio-util = "0.7"
async-trait = "0.1"
roxmltree = "0.21"
which = "8"
log = "0.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["signal"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["process", "time", "macros", "rt", "rt-multi-thread", "io-util", "sync"] }

[lints]
workspace = true
