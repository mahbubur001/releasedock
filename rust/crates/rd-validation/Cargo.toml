[package]
name = "rd-validation"
description = "Release validation: every pre-release check, readme rules, plugin and theme validation rules"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rd-support = { path = "../rd-support" }
rd-model = { path = "../rd-model" }
rd-versioning = { path = "../rd-versioning" }
rd-inspection = { path = "../rd-inspection" }
rd-records = { path = "../rd-records" }
regex.workspace = true
# Swift `String.count` / `prefix(_:)` count grapheme clusters (user-visible lengths).
unicode-segmentation = "1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
